<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111a2e" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="chip-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="6" />

  <!-- Background Circuit Lines -->
  <g opacity="0.25" stroke="#00F0FF" stroke-width="3" stroke-linecap="round">
    <path d="M 80 120 L 140 120 L 180 160" fill="none" />
    <circle cx="80" cy="120" r="6" fill="#00F0FF" />
    
    <path d="M 432 120 L 372 120 L 332 160" fill="none" />
    <circle cx="432" cy="120" r="6" fill="#00F0FF" />
    
    <path d="M 80 392 L 150 392 L 190 352" fill="none" />
    <circle cx="80" cy="392" r="6" fill="#00F0FF" />
    
    <path d="M 432 392 L 362 392 L 322 352" fill="none" />
    <circle cx="432" cy="392" r="6" fill="#00F0FF" />
  </g>

  <!-- Chip Core -->
  <rect x="146" y="146" width="220" height="220" rx="36" fill="url(#chip-grad)" stroke="url(#cyan-glow)" stroke-width="4" filter="url(#glow)" />

  <!-- Chip Pins -->
  <g stroke="#00F0FF" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <!-- Top Pins -->
    <line x1="186" y1="130" x2="186" y2="146" />
    <line x1="226" y1="130" x2="226" y2="146" />
    <line x1="256" y1="130" x2="256" y2="146" />
    <line x1="286" y1="130" x2="286" y2="146" />
    <line x1="326" y1="130" x2="326" y2="146" />

    <!-- Bottom Pins -->
    <line x1="186" y1="366" x2="186" y2="382" />
    <line x1="226" y1="366" x2="226" y2="382" />
    <line x1="256" y1="366" x2="256" y2="382" />
    <line x1="286" y1="366" x2="286" y2="382" />
    <line x1="326" y1="366" x2="326" y2="382" />

    <!-- Left Pins -->
    <line x1="130" y1="186" x2="146" y2="186" />
    <line x1="130" y1="226" x2="146" y2="226" />
    <line x1="130" y1="256" x2="146" y2="256" />
    <line x1="130" y1="286" x2="146" y2="286" />
    <line x1="130" y1="326" x2="146" y2="326" />

    <!-- Right Pins -->
    <line x1="366" y1="186" x2="382" y2="186" />
    <line x1="366" y1="226" x2="382" y2="226" />
    <line x1="366" y1="256" x2="382" y2="256" />
    <line x1="366" y1="286" x2="382" y2="286" />
    <line x1="366" y1="326" x2="382" y2="326" />
  </g>

  <!-- Pulse / ECG / Diagnostic Wave -->
  <path d="M 176 256 L 210 256 L 226 216 L 246 296 L 266 226 L 282 276 L 296 256 L 336 256" 
        fill="none" stroke="url(#cyan-glow)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Radar / Magnifying Glass Diagnostic Focus (Soi) -->
  <circle cx="256" cy="256" r="68" fill="none" stroke="url(#accent-grad)" stroke-width="5" stroke-dasharray="14 10" opacity="0.9" />
  <circle cx="256" cy="256" r="12" fill="#00F0FF" filter="url(#glow)" />
</svg>
